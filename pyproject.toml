[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "arrmes"
version = "1.2.1"
description = "Local media routing with validated service operations and portable inference"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
mlx = ["mlx-lm==0.31.1"]
test = ["pytest>=8,<10"]

[project.scripts]
arrmes = "arrmes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
