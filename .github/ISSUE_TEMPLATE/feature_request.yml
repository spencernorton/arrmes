name: Feature request
description: Propose a change to how Arrmes works.
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that Arrmes makes hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change, and what should it look like?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: ["Router / model inference", "Verification boundary (verify_proposal)", "Live gateway adapter", "HTTP server / auth / write confirmation", "Sandbox cluster", "Other / not sure"]
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
