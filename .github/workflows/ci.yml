name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install core package and tests
        run: python -m pip install ".[test]"
      - name: Verify core boundaries and native service fixtures
        run: python -m pytest -q
  portable-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install without optional model or GPU dependencies
        run: python -m pip install ".[test]"
      - name: Verify Python runtime and service boundaries
        run: python -m pytest -q
  windows-native-build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Obtain pinned upstream runtime source
        shell: pwsh
        run: |
          git init native-runtime
          git -C native-runtime remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C native-runtime fetch --depth 1 origin d81235049384534c167caea52b85a694f6103d14
          git -C native-runtime checkout --detach FETCH_HEAD
          if ((git -C native-runtime rev-parse HEAD) -ne 'd81235049384534c167caea52b85a694f6103d14') { throw 'Runtime revision mismatch' }
      - name: Compile CPU server without CUDA
        shell: pwsh
        run: |
          cmake -S native-runtime -B native-runtime/build -DGGML_NATIVE=OFF -DGGML_CUDA=OFF -DGGML_OPENMP=OFF -DGGML_BLAS=OFF -DLLAMA_OPENSSL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=ON
          if ($LASTEXITCODE -ne 0) { throw 'Runtime configuration failed' }
          cmake --build native-runtime/build --config Release --target llama-server --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Runtime build failed' }
          & native-runtime/build/bin/Release/llama-server.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'CPU runtime executable failed' }
