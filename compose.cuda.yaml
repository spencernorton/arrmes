# Linux NVIDIA override. CPU deployments do not pull this image or need CUDA.
services:
  inference:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b11429@sha256:883915ea20a4b350e98f7284098f4d400c21e9b366e248d397cd42d90602a84c
    command: ["--model", "/models/arrmes.gguf", "--ctx-size", "4096", "--parallel", "1", "--threads", "4", "--threads-batch", "4", "--n-gpu-layers", "all", "--device", "CUDA0", "--host", "0.0.0.0", "--port", "8080", "--jinja", "--no-webui"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
